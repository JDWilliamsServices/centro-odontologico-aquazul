<!DOCTYPE html>
<html lang="es">
  <body>
    <form name="contacto-aquazul" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contacto-aquazul" />
      <input type="text" name="nombre" />
      <input type="email" name="email" />
      <input type="tel" name="telefono" />
      <select name="servicio"></select>
      <select name="preferencia"></select>
      <textarea name="mensaje"></textarea>
      <input name="bot-field" />
    </form>
    <form name="citas-aquazul" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="citas-aquazul" />
      <input type="text" name="nombre" />
      <input type="tel" name="telefono" />
      <input type="email" name="email" />
      <input type="date" name="fecha_preferida" />
      <input type="time" name="hora_preferida" />
      <select name="servicio">
        <option value="General Consultation">General Consultation</option>
        <option value="Dental Cleaning">Dental Cleaning</option>
        <option value="Whitening">Whitening</option>
        <option value="Orthodontics">Orthodontics</option>
        <option value="Dental Implants">Dental Implants</option>
        <option value="Emergency Dental Visit">Emergency Dental Visit</option>
        <option value="Other">Other</option>
      </select>
      <input type="radio" name="paciente_nuevo" value="Si" />
      <input type="radio" name="paciente_nuevo" value="No" />
      <textarea name="mensaje"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
